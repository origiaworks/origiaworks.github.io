<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ（Contact）｜ORIGIAWORKS</title>

    <link rel="icon" href="https://origiaworks.github.io/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="https://origiaworks.github.io/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="https://origiaworks.github.io/apple-touch-icon.png">
    <meta property="og:site_name" content="ORIGIAWORKS">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:type" content="website">
    <meta property="og:title" content="お問い合わせ（Contact）｜ORIGIAWORKS">
    <meta property="og:description" content="ORIGIAWORKSへのお問い合わせページ。ゲーム・イラスト・動画・音楽などの制作に関するご相談・ご連絡はこちらから。">
    <meta property="og:url" content="https://origiaworks.github.io/contact.html">
    <meta property="og:image" content="https://origiaworks.github.io/images/hero-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "HOME",
      "item": "https://origiaworks.github.io/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Contact",
      "item": "https://origiaworks.github.io/contact.html"
    }
  ]
}
    </script>
</head>
<body>
    <!-- ヘッダー（全ページ共通） -->
    <header id="header-placeholder"></header>
    
    <!-- ここからが各ページ固有のコンテンツ --><!-- index.html の <main> の中身 -->
    <main>
        <div class="container"> <!-- (1) ページ全体の幅を About等と合わせる枠 -->
        
            <h2>Contact<br>（お問い合わせ）</h2>    

            <div class="contact-form-center"> <!-- (2) この中身だけを中央に寄せる枠 -->
            
                <div class="form-group">        
                    <label for="details">お問い合わせ内容：</label><br>
                    <textarea 
                        id="details" 
                        name="details" 
                        rows="8" 
                        cols="60"
                        placeholder="具体的な内容をご記入ください。"
                        required
                    ></textarea>
                </div>
                
                <div>
                    <button onclick="contactSendMail()">メールクライアントを起動して送信</button>
                </div>

            </div>
        </div>
    </main>
    <!-- ここまでが各ページ固有のコンテンツ -->

    <!-- フッター（全ページ共通） -->
    <footer id="footer-placeholder"></footer>
    <script src="js/main.js"></script>
    
    <!-- データ削除処理用JavaScriptファイルを読み込む -->
    <script src="js/contact_sendmail.js"></script>
</body>
</html>
