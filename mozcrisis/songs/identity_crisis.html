<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACK: Identity Crisis | MOZCRISIS</title>
    <!-- 外部CSSの読み込み (階層に注意: ../ で上の階層に戻る) -->
    <link rel="stylesheet" href="../css/song_style.css">
</head>

<body>

    <nav><a href="../index.html">SYS_ROOT >> RETURN_TO_DASHBOARD</a></nav>

    <div id="dynamic-hero" class="hero-visual"></div>

    <div class="container">
        <header class="song-header">
            <div class="artwork-area">
                <img id="dynamic-artwork" src="" class="artwork-img" alt="Artwork">
            </div>
            <div class="title-area">
                <div id="dynamic-track-id" class="track-id">TRACK_ID_PENDING</div>
                <h1 id="dynamic-title">Identity Crisis</h1>
                <div class="meta-list">
                    <!-- 曲ごとに書き換え -->
                    <div class="meta-item"><span class="meta-label">RELEASE</span><span
                            class="meta-value">2026.08.07</span></div>
                    <div class="meta-item"><span class="meta-label">ARCHITECT</span><span class="meta-value">ROSE</span>
                    </div>
                    <div class="meta-item"><span class="meta-label">STATUS</span><span
                            class="meta-value">STABLE_BUILD</span></div>
                </div>
            </div>
        </header>
        <section class="lead-section">
            <div class="lead-header">README.md</div>
            <p id="lead-content" class="lead-text">Streaming system documentation...</p>
        </section>

        <div class="terminal">
            <div class="terminal-bar">
                <span id="file-name-display">lyrics_source.txt</span>
                <span style="color: #444;">UTF-8 / SH</span>
            </div>
            <pre id="lyrics-content" class="lyrics-box">Streaming lyrics data...</pre>
        </div>
    </div>

    <script>
        // 1. ファイル名からIDを取得
        const SONG_ID = window.location.pathname.split('/').pop().replace('.html', '');

        // 2. 自動セット
        document.getElementById('dynamic-title').textContent = SONG_ID.replaceAll('_', ' ');
        document.getElementById('dynamic-track-id').textContent = "TRACK_" + SONG_ID.toUpperCase();
        document.getElementById('dynamic-hero').style.backgroundImage = `url('./keyvisual/${SONG_ID}_keyvisual.png')`;
        document.getElementById('dynamic-artwork').src = `./artwork/${SONG_ID}_artwork.jpg`;

        async function loadTextFile(path, elementId) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error();
                const text = await response.text();
                // textContentではなくinnerTextにすることで改行の扱いを安定させます
                document.getElementById(elementId).innerText = text;
            } catch (e) {
                document.getElementById(elementId).innerText = `[ERROR] Failed to load: ${path}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTextFile(`lyric/${SONG_ID}_lyric.txt`, 'lyrics-content');
            loadTextFile(`lead/${SONG_ID}_lead.txt`, 'lead-content');
            document.getElementById('file-name-display').textContent = SONG_ID + "_lyric.txt";
        });
    </script>

</body>

</html>
