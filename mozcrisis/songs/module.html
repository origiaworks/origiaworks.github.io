<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACK_MODULE | MOZCRISIS</title>
    <style>
        :root {
            --main-red: #ff3e3e;
            --cyber-blue: #00f3ff;
            --bg-black: #0a0a0a;
            --text-white: #e0e0e0;
            --code-font: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        body { 
            background-color: var(--bg-black); 
            color: var(--text-white); 
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif; 
            margin: 0; 
            line-height: 1.6; 
            overflow-x: hidden; 
        }

        /* --- Navigation --- */
        nav { 
            padding: 15px 20px; 
            font-family: var(--code-font); 
            border-bottom: 1px solid #222; 
            background: rgba(0,0,0,0.9); 
            backdrop-filter: blur(8px); 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 1000; 
            box-sizing: border-box; 
        }

        nav a { 
            color: var(--main-red); 
            text-decoration: none; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
        }

        /* --- Hero Visual --- */
        .hero-visual {
            width: 100%; 
            height: 55vh;
            background-position: center; 
            background-size: cover; 
            background-repeat: no-repeat;
            position: relative; 
            margin-top: 50px; 
            display: flex; 
            align-items: flex-end; 
            background-color: #111;
        }

        .hero-visual::after {
            content: ''; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60%;
            background: linear-gradient(to top, var(--bg-black), transparent);
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            position: relative; 
            z-index: 10; 
        }

        /* --- Header Area --- */
        .song-header { 
            display: flex; 
            gap: 40px; 
            margin-top: -100px; 
            flex-wrap: wrap; 
            align-items: flex-end; 
        }

        .artwork-area { 
            flex: 0 0 260px; 
            z-index: 20; 
        }

        .artwork-img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            border: 1px solid var(--main-red); 
            background: #000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            object-fit: cover; 
        }

        .title-area { 
            flex: 1; 
            min-width: 300px; 
            padding-bottom: 10px; 
        }

        .track-id { 
            font-family: var(--code-font); 
            color: var(--main-red); 
            font-size: 1.1rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
        }

        h1 { 
            font-family: var(--code-font); 
            font-size: clamp(2.2rem, 6vw, 3.8rem); 
            margin: 0 0 20px; 
            line-height: 1; 
            text-transform: uppercase; 
            text-shadow: 0 0 20px rgba(0,0,0,1); 
        }

        .meta-list { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            font-family: var(--code-font); 
            border-top: 1px solid #333; 
            padding-top: 20px; 
        }

        .meta-label { 
            font-size: 0.7rem; 
            color: #666; 
            display: block; 
            margin-bottom: 5px; 
        }

        .meta-value { 
            font-size: 0.95rem; 
            color: var(--cyber-blue); 
        }

        /* --- YouTube Section --- */
        .video-section { 
            background: #000; 
            border: 1px solid #333; 
            margin: 60px 0; 
            position: relative; 
            padding-top: 30px; 
        }

        .video-section::before { 
            content: "VISUAL_MONITOR.exe"; 
            position: absolute; 
            top: 8px; 
            left: 15px; 
            font-family: var(--code-font); 
            font-size: 0.7rem; 
            color: #444; 
        }

        .video-container { 
            position: relative; 
            width: 100%; 
            padding-top: 56.25%; 
        }

        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* --- Lead Section (README) --- */
        .lead-section { 
            padding: 30px; 
            background: rgba(0, 243, 255, 0.03); 
            border-left: 3px solid var(--cyber-blue); 
            margin-bottom: 50px; 
        }

        .lead-header { 
            font-family: var(--code-font); 
            font-size: 0.85rem; 
            color: var(--cyber-blue); 
            margin-bottom: 15px; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        .lead-text { 
            margin: 0; 
            font-size: 1.05rem; 
            color: #ccc; 
            line-height: 1.9; 
            white-space: pre-wrap; 
            word-break: break-all; 
        }

        /* --- Lyrics Terminal --- */
        .terminal { 
            background: #000; 
            border: 1px solid #333; 
            border-radius: 4px; 
            overflow: hidden; 
            margin-bottom: 100px; 
        }

        .terminal-bar { 
            background: #1a1a1a; 
            padding: 12px 15px; 
            font-size: 0.75rem; 
            color: #888; 
            font-family: var(--code-font); 
            border-bottom: 1px solid #333; 
            display: flex; 
            justify-content: space-between; 
        }

        .lyrics-box { 
            padding: 40px; 
            font-family: var(--code-font); 
            font-size: 1.05rem; 
            white-space: pre-wrap; 
            color: #aaa; 
            margin: 0; 
            line-height: 1.8; 
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .hero-visual { height: 40vh; }
            .song-header { margin-top: -60px; gap: 20px; }
            .artwork-area { flex: 0 0 200px; margin: 0 auto; }
            .title-area { text-align: center; }
            .meta-list { grid-template-columns: 1fr; gap: 10px; }
            .lyrics-box { padding: 25px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <nav><a href="../index.html">SYS_ROOT >> RETURN_TO_DASHBOARD</a></nav>

    <div id="dynamic-hero" class="hero-visual"></div>

    <div class="container">
        <header class="song-header">
            <div class="artwork-area">
                <img id="dynamic-artwork" src="" class="artwork-img" alt="Artwork">
            </div>
            <div class="title-area">
                <div id="dynamic-track-id" class="track-id">LOADING...</div>
                <h1 id="dynamic-title">ACCESSING_DATA...</h1>
                <div class="meta-list">
                    <div class="meta-item"><span class="meta-label">RELEASE</span><span id="meta-release" class="meta-value">----.--.--</span></div>
                    <div class="meta-item"><span class="meta-label">ARCHITECT</span><span id="meta-architect" class="meta-value">----</span></div>
                    <div class="meta-item"><span class="meta-label">STATUS</span><span id="meta-status" class="meta-value">----</span></div>
                </div>
            </div>
        </header>

        <section class="video-section">
            <div class="video-container">
                <iframe id="dynamic-yt" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </section>

        <section class="lead-section">
            <div class="lead-header">README.md</div>
            <p id="lead-content" class="lead-text">Fetching module documentation...</p>
        </section>

        <div class="terminal">
            <div class="terminal-bar">
                <span id="file-name-display">source_code.txt</span>
                <span style="color: #444;">UTF-8 / RAW_FETCH</span>
            </div>
            <pre id="lyrics-content" class="lyrics-box">Awaiting data stream...</pre>
        </div>
    </div>

    <script>
        async function loadModuleData() {
            try {
                const params = new URLSearchParams(window.location.search);
                const SONG_ID = params.get('id');

                if (!SONG_ID) {
                    window.location.href = '../index.html'; 
                    return;
                }

                // JSONからメタデータを取得
                const response = await fetch('data/songs.json');
                const database = await response.json();
                const data = database[SONG_ID];

                if (!data) throw new Error("MODULE_NOT_FOUND");

                // HTML反映
                document.title = `TRACK: ${data.title} | MOZCRISIS`;
                document.getElementById('dynamic-title').textContent = data.title;
                document.getElementById('dynamic-track-id').textContent = "TRACK_" + SONG_ID.toUpperCase();
                document.getElementById('meta-release').textContent = data.release;
                document.getElementById('meta-architect').textContent = data.architect;
                document.getElementById('meta-status').textContent = data.status;

                if(data.youtube) {
                    document.getElementById('dynamic-yt').src = `https://www.youtube.com/embed/${data.youtube}`;
                }

                // 画像反映
                document.getElementById('dynamic-hero').style.backgroundImage = `url('./keyvisual/${SONG_ID}_keyvisual.png')`;
                document.getElementById('dynamic-artwork').src = `./artwork/${SONG_ID}_artwork.jpg`;
                document.getElementById('file-name-display').textContent = SONG_ID + "_lyric.txt";

                // 外部テキストファイルをIDベースで読み込み
                fetchTextFile(`lead/${SONG_ID}_lead.txt`, 'lead-content');
                fetchTextFile(`lyric/${SONG_ID}_lyric.txt`, 'lyrics-content');

            } catch (e) {
                console.error(e);
                document.querySelector('.container').innerHTML = `
                    <div style="padding: 100px 0; text-align: center;">
                        <h1 style="color:var(--main-red); font-size: 2rem;">[ERROR] SYSTEM_FAILURE</h1>
                        <p style="color: #666; font-family: var(--code-font);">${e.message}</p>
                        <a href="../index.html" style="color: var(--cyber-blue); text-decoration: none;">>> RETURN_TO_DASHBOARD</a>
                    </div>
                `;
            }
        }

        async function fetchTextFile(path, targetId) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error(`FILE_NOT_FOUND: ${path}`);
                const text = await response.text();
                document.getElementById(targetId).innerText = text;
            } catch (e) {
                document.getElementById(targetId).innerText = `[ERROR] Failed to load ${path}`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadModuleData);
    </script>
</body>
</html>
