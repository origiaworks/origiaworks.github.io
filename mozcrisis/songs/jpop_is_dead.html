<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACK: J-Pop is Dead | MOZCRISIS</title>
    <style>
        :root {
            --main-red: #ff3e3e;
            --cyber-blue: #00f3ff;
            --bg-black: #0a0a0a;
            --text-white: #e0e0e0;
            --code-font: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation: 常に最前面 */
        nav {
            padding: 15px 20px;
            font-family: var(--code-font);
            border-bottom: 1px solid #222;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        nav a {
            color: var(--main-red);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Hero Visual: 横長画像 */
        .hero-visual {
            width: 100%;
            height: 55vh;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
            margin-top: 50px;
            /* navの高さ分 */
            display: flex;
            align-items: flex-end;
            background-color: #111;
        }

        .hero-visual::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, var(--bg-black), transparent);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Header Area */
        .song-header {
            display: flex;
            gap: 40px;
            margin-top: -100px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .artwork-area {
            flex: 0 0 260px;
            z-index: 20;
        }

        .artwork-img {
            width: 100%;
            aspect-ratio: 1/1;
            border: 1px solid var(--main-red);
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }

        .title-area {
            flex: 1;
            min-width: 300px;
            padding-bottom: 10px;
        }

        .track-id {
            font-family: var(--code-font);
            color: var(--main-red);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        h1 {
            font-family: var(--code-font);
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin: 0 0 20px;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 0, 0, 1);
        }

        .meta-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            font-family: var(--code-font);
            border-top: 1px solid #333;
            padding-top: 20px;
        }

        .meta-label {
            font-size: 0.7rem;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 0.95rem;
            color: var(--cyber-blue);
        }

        /* Video Monitor */
        .video-section {
            background: #000;
            border: 1px solid #333;
            margin: 60px 0;
            position: relative;
            padding-top: 30px;
        }

        .video-section::before {
            content: "VISUAL_MONITOR.exe";
            position: absolute;
            top: 8px;
            left: 15px;
            font-family: var(--code-font);
            font-size: 0.7rem;
            color: #444;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* README/リード文 */
        .lead-section {
            padding: 30px;
            background: rgba(0, 243, 255, 0.03);
            border-left: 3px solid var(--cyber-blue);
            margin-bottom: 50px;
        }

        .lead-header {
            font-family: var(--code-font);
            font-size: 0.85rem;
            color: var(--cyber-blue);
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .lead-text {
            margin: 0;
            font-size: 1.05rem;
            color: #ccc;
            line-height: 1.9;
            text-align: justify;
        }

        /* Lyrics Terminal */
        .terminal {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 100px;
        }

        .terminal-bar {
            background: #1a1a1a;
            padding: 12px 15px;
            font-size: 0.75rem;
            color: #888;
            font-family: var(--code-font);
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .lyrics-box {
            padding: 40px;
            font-family: var(--code-font);
            font-size: 1.05rem;
            white-space: pre-wrap;
            color: #aaa;
            margin: 0;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .hero-visual {
                height: 40vh;
            }

            .song-header {
                margin-top: -60px;
                gap: 20px;
            }

            .artwork-area {
                flex: 0 0 200px;
                margin: 0 auto;
            }

            .title-area {
                text-align: center;
            }

            .meta-list {
                grid-template-columns: 1fr;
            }

            .lyrics-box {
                padding: 25px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <nav><a href="../index.html">SYS_ROOT >> RETURN_TO_DASHBOARD</a></nav>

    <!-- IDを元に画像を自動セットするためのコンテナ -->
    <div id="dynamic-hero" class="hero-visual"></div>

    <div class="container">
        <header class="song-header">
            <div class="artwork-area">
                <img id="dynamic-artwork" src="" class="artwork-img" alt="Artwork">
            </div>
            <div class="title-area">
                <div id="dynamic-track-id" class="track-id">TRACK_ID_PENDING</div>
                <h1 id="dynamic-title">LOADING...</h1>
                <div class="meta-list">
                    <div class="meta-item"><span class="meta-label">RELEASE</span><span id="meta-date"
                            class="meta-value">2026.08.07</span></div>
                    <div class="meta-item"><span class="meta-label">ARCHITECT</span><span id="meta-architect"
                            class="meta-value">ROSE</span></div>
                    <div class="meta-item"><span class="meta-label">STATUS</span><span
                            class="meta-value">STABLE_BUILD</span></div>
                </div>
            </div>
        </header>

        <div class="video-section">
            <div class="video-container">
                <!-- YouTube IDをここに直接入れる -->
                <iframe src="https://www.youtube.com/embed/g1z95tXp5UI" allowfullscreen></iframe>
            </div>
        </div>

        <section class="lead-section">
            <div class="lead-header">README.md</div>
            <p class="lead-text">
                （ここにリード文を入力してください）
            </p>
        </section>

        <div class="terminal">
            <div class="terminal-bar">
                <span id="file-name-display">lyrics_source.txt</span>
                <span style="color: #444;">UTF-8 / SH</span>
            </div>
            <pre class="lyrics-box" id="lyrics-content">Streaming lyrics data...</pre>
        </div>
    </div>

    <script>
        // 1. ファイル名から曲のIDを取得 (例: jpop_is_dead)
        const SONG_ID = window.location.pathname.split('/').pop().replace('.html', '');

        // 2. 命名規則に従って各種パスを生成
        const PATHS = {
            lyrics: `./lyrics/${SONG_ID}_lyric.txt`,
            artwork: `./artwork/${SONG_ID}_artwork.jpg`, // または .png
            keyvisual: `./keyvisual/${SONG_ID}_keyvisual.png`
        };

        // 3. 画面上の要素を自動更新
        document.getElementById('dynamic-title').textContent = SONG_ID.replaceAll('_', ' ');
        document.getElementById('dynamic-track-id').textContent = "TRACK_" + SONG_ID.toUpperCase();
        document.getElementById('dynamic-hero').style.backgroundImage = `url('${PATHS.keyvisual}')`;
        document.getElementById('dynamic-artwork').src = PATHS.artwork;

        // 4. 歌詞の読み込み
        async function fetchLyrics() {
            try {
                const response = await fetch(PATHS.lyrics);
                if (!response.ok) throw new Error();
                const text = await response.text();
                document.getElementById('lyrics-content').textContent = text;
                document.getElementById('file-name-display').textContent = SONG_ID + "_lyric.txt";
            } catch (e) {
                document.getElementById('lyrics-content').textContent =
                    `[ERROR] Failed to load: ${PATHS.lyrics}\n\n` +
                    "【確認事項】\n" +
                    "1. VS Codeの 'Live Server' で開いていますか？\n" +
                    "2. ファイル名が " + SONG_ID + "_lyric.txt ですか？\n" +
                    "3. lyrics フォルダ内にファイルがありますか？";
            }
        }
        window.addEventListener('DOMContentLoaded', fetchLyrics);
    </script>

</body>

</html>
