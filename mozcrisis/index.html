<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZCRISIS | Algorithm Rock</title>
    <style>
        :root {
            --main-red: #ff3e3e;
            --cyber-blue: #00f3ff;
            --bg-black: #0a0a0a;
            --card-bg: #151515;
            --text-white: #e0e0e0;
            --code-font: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
            margin: 0;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-family: var(--code-font);
            font-size: 0.75rem;
            border-bottom: 1px solid #222;
        }

        nav a { color: #fff; text-decoration: none; transition: 0.3s; }
        nav a:hover { color: var(--cyber-blue); }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            text-align: center;
            padding: 0 20px;
        }

        .glitch-logo {
            font-size: clamp(3rem, 12vw, 9rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            font-family: var(--code-font);
            text-shadow: 2px 0 var(--main-red), -2px 0 var(--cyber-blue);
        }

        .tagline {
            font-family: var(--code-font);
            color: var(--cyber-blue);
            font-size: clamp(0.7rem, 2vw, 1.1rem);
            margin-top: 20px;
            opacity: 0.8;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 80px 20px; }
        .section-header { margin-bottom: 40px; }
        .section-header h2 { font-family: var(--code-font); font-size: clamp(1.8rem, 5vw, 2.5rem); display: inline-block; border-right: 10px solid var(--main-red); padding-right: 15px; margin: 0; }

        /* --- DISCOGRAPHY GROUPS --- */
        .disc-section { margin-bottom: 80px; }
        .disc-section-title {
            font-family: var(--code-font);
            font-size: 1.1rem;
            color: var(--cyber-blue);
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .disc-section-title::before { content: "// SECTION: "; opacity: 0.5; font-size: 0.8rem; margin-right: 5px; }

        .disc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; }
        .disc-card { text-align: left; }
        .jacket { width: 100%; aspect-ratio: 1 / 1; background: #222; margin-bottom: 15px; border: 1px solid #333; object-fit: cover; transition: 0.3s; }
        .disc-card:hover .jacket { border-color: var(--main-red); transform: scale(1.03); }
        .disc-title { font-size: 0.95rem; font-weight: bold; color: #fff; display: block; line-height: 1.4; }
        /* -------------------------- */

        .logic-box { background: #000; border: 1px solid #333; padding: clamp(30px, 5vw, 50px); font-family: var(--code-font); margin: 40px auto 100px; position: relative; }
        .logic-box::before { content: "lyric_logic.sh"; position: absolute; top: -15px; left: 20px; background: var(--main-red); padding: 2px 12px; font-size: 0.75rem; color: #fff; font-weight: bold; }
        .logic-desc { margin-top: 30px; color: #ccc; font-size: 0.95rem; border-top: 1px solid #222; padding-top: 20px; }

        footer { background: #050505; padding: 60px 20px; text-align: center; border-top: 1px solid #1a1a1a; }
        .disclaimer-text { font-size: 0.65rem; color: #555; margin-top: 20px; line-height: 1.6; max-width: 800px; margin: 20px auto 0; font-family: sans-serif; }
    </style>
</head>
<body>
    <nav><a href="#home">01_HOME</a><a href="#logic">02_LOGIC</a><a href="#members">03_MEMBERS</a><a href="#discography">04_DISCOGRAPHY</a><a href="policy.html">05_PROTOCOL</a></nav>
    <header id="home">
        <div class="glitch-logo">MOZCRISIS</div>
        <div class="tagline">Execute: AlgorithmRock.sh --heavy --fast</div>
    </header>
    <div class="container">
        <!-- (Logic Section and Members Section remain same) -->
        <section id="discography">
            <div class="section-header"><h2>DISCOGRAPHY</h2></div>
            <div id="disc-grid-container"></div>
        </section>
    </div>
    <footer>
        <div class="copyright">&copy; 2026 MOZCRISIS / ORIGIAWORKS.</div>
        <div class="disclaimer-text">MOZCRISIS（モズクライシス）はORIGIAWORKSが管理する架空の団体であり、設定や物語はすべてフィクションです。楽曲制作には生成AI技術を使用しています。</div>
    </footer>
    <script>
        async function loadDiscography() {
            try {
                const response = await fetch('data/songs.json');
                const data = await response.json();
                const container = document.getElementById('disc-grid-container');
                container.innerHTML = '';

                // セクションごとにグループ化
                const sections = {};
                for (const sid in data) {
                    const sec = data[sid].section || "OTHERS";
                    if (!sections[sec]) sections[sec] = [];
                    sections[sec].push({ id: sid, ...data[sid] });
                }

                // セクション順に描画（JSONの出現順）
                for (const sectionName in sections) {
                    const sectionWrapper = document.createElement('div');
                    sectionWrapper.className = 'disc-section';
                    sectionWrapper.innerHTML = `<div class="disc-section-title">${sectionName}</div>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'disc-grid';
                    sections[sectionName].forEach(song => {
                        grid.innerHTML += `
                            <div class="disc-card">
                                <a href="songs.html?id=${song.id}" style="text-decoration:none;">
                                    <img src="songs/${song.id}/${song.id}_artwork.jpg" class="jacket">
                                    <span class="disc-title">${song.title}</span>
                                </a>
                            </div>`;
                    });
                    sectionWrapper.appendChild(grid);
                    container.appendChild(sectionWrapper);
                }
            } catch (e) { console.error(e); }
        }
        window.addEventListener('DOMContentLoaded', loadDiscography);
    </script>
</body>
</html>
