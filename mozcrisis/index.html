<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOZCRISIS | Algorithm Rock</title>
    <style>
        :root {
            --main-red: #ff3e3e;
            --cyber-blue: #00f3ff;
            --bg-black: #0a0a0a;
            --card-bg: #151515;
            --text-white: #e0e0e0;
            --code-font: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        body { background-color: var(--bg-black); color: var(--text-white); font-family: 'Segoe UI', sans-serif; margin: 0; line-height: 1.6; scroll-behavior: smooth; }
        nav { position: fixed; top: 0; width: 100%; padding: 15px 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; justify-content: center; gap: 20px; font-family: var(--code-font); font-size: 0.75rem; border-bottom: 1px solid #222; }
        nav a { color: #fff; text-decoration: none; transition: 0.3s; }
        nav a:hover { color: var(--cyber-blue); }

        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); text-align: center; padding: 0 20px; }
        .glitch-logo { font-size: clamp(3rem, 12vw, 9rem); font-weight: 900; letter-spacing: 0.15em; font-family: var(--code-font); text-shadow: 2px 0 var(--main-red), -2px 0 var(--cyber-blue); }
        .tagline { font-family: var(--code-font); color: var(--cyber-blue); font-size: clamp(0.7rem, 2vw, 1.1rem); margin-top: 20px; opacity: 0.8; }

        .container { max-width: 1200px; margin: 0 auto; padding: 80px 20px; }

        /* --- EDITION BLOCK STYLES --- */
        .edition-block {
            margin-bottom: 120px;
            border-top: 1px solid #222;
            padding-top: 40px;
        }

        .edition-header {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .edition-master-jacket {
            flex: 0 0 280px;
            aspect-ratio: 1 / 1;
            background: #111;
            border: 2px solid var(--main-red);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.2);
        }

        .edition-info {
            flex: 1;
            min-width: 300px;
        }

        .edition-label {
            font-family: var(--code-font);
            color: var(--main-red);
            font-size: 0.8rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .edition-title {
            font-family: var(--code-font);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- SONG GRID (INSIDE EDITION) --- */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .song-card {
            text-align: left;
            transition: 0.3s;
        }

        .song-card:hover { transform: translateY(-5px); }

        .song-jacket {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #222;
            margin-bottom: 10px;
            border: 1px solid #333;
            object-fit: cover;
        }

        .song-card:hover .song-jacket { border-color: var(--cyber-blue); }

        .song-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ccc;
            display: block;
            line-height: 1.4;
        }

        /* -------------------------- */

        .logic-box { background: #000; border: 1px solid #333; padding: clamp(30px, 5vw, 50px); font-family: var(--code-font); margin: 40px auto 100px; position: relative; }
        .logic-box::before { content: "lyric_logic.sh"; position: absolute; top: -15px; left: 20px; background: var(--main-red); padding: 2px 12px; font-size: 0.75rem; color: #fff; font-weight: bold; }
        .logic-desc { margin-top: 30px; color: #ccc; font-size: 0.95rem; border-top: 1px solid #222; padding-top: 20px; }

        .member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-bottom: 100px; }
        .member-link { text-decoration: none; color: inherit; display: block; }
        .member-card { background: var(--card-bg); border: 1px solid #222; overflow: hidden; transition: 0.4s ease; }
        .img-wrapper { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .info { padding: 20px; }
        .role-tag { font-family: var(--code-font); color: var(--main-red); font-size: 0.75rem; }
        .name-jp { font-size: 1.5rem; font-weight: bold; display: block; }

        footer { background: #050505; padding: 60px 20px; text-align: center; border-top: 1px solid #1a1a1a; }
        .disclaimer-text { font-size: 0.65rem; color: #555; margin-top: 20px; max-width: 800px; margin: 20px auto 0; }

        @media (max-width: 768px) {
            .edition-header { flex-direction: column; align-items: center; text-align: center; }
            .edition-master-jacket { flex: 0 0 200px; }
        }
    </style>
</head>
<body>
    <nav><a href="#home">01_HOME</a><a href="#logic">02_LOGIC</a><a href="#members">03_MEMBERS</a><a href="#discography">04_DISCOGRAPHY</a><a href="policy.html">05_PROTOCOL</a></nav>
    <header id="home"><div class="glitch-logo">MOZCRISIS</div><div class="tagline">Execute: AlgorithmRock.sh --heavy --fast</div></header>
    <div class="container">
        
        <!-- Logic & Members (Previous implementations) -->
        <section id="members">
            <div class="section-header"><h2>MEMBERS</h2></div>
            <div class="member-grid">
                <!-- Member cards here -->
                <a href="members.html?id=rose" class="member-link"><div class="member-card"><div class="img-wrapper"><img src="members/img/rose.png"></div><div class="info"><div class="role-tag">Vo & Gt</div><span class="name-jp">ローズ</span></div></div></a>
                <a href="members.html?id=yodo" class="member-link"><div class="member-card"><div class="img-wrapper"><img src="members/img/yodo.png"></div><div class="info"><div class="role-tag">Bass</div><span class="name-jp">淀</span></div></div></a>
                <a href="members.html?id=lena" class="member-link"><div class="member-card"><div class="img-wrapper"><img src="members/img/lena.png"></div><div class="info"><div class="role-tag">Key & Scream</div><span class="name-jp">レナ</span></div></div></a>
                <a href="members.html?id=mio" class="member-link"><div class="member-card"><div class="img-wrapper"><img src="members/img/mio.png"></div><div class="info"><div class="role-tag">Drums</div><span class="name-jp">ミオ</span></div></div></a>
                <a href="members.html?id=jiwoo" class="member-link"><div class="member-card"><div class="img-wrapper"><img src="members/img/jiwoo.png"></div><div class="info"><div class="role-tag">DJ</div><span class="name-jp">JIWOO</span></div></div></a>
            </div>
        </section>

        <section id="discography">
            <div class="section-header"><h2>DISCOGRAPHY</h2></div>
            <div id="edition-container"></div>
        </section>
    </div>
    <footer><div class="copyright">&copy; 2026 MOZCRISIS / ORIGIAWORKS.</div></footer>

    <script>
        async function loadDiscography() {
            try {
                const response = await fetch('data/songs.json');
                const data = await response.json();
                const container = document.getElementById('edition-container');
                container.innerHTML = '';

                // 1. エディションごとにグループ化
                const editions = {};
                for (const sid in data) {
                    const ed = data[sid].edition || "STANDARD_BUILD";
                    if (!editions[ed]) editions[ed] = [];
                    editions[ed].push({ id: sid, ...data[sid] });
                }

                // 2. エディションごとに描画
                for (const editionName in editions) {
                    const edWrapper = document.createElement('div');
                    edWrapper.className = 'edition-block';

                    // エディションヘッダー（マスタージャケット + 情報）
                    // ジャケットのパス例: data/editions/OVERLOAD_EDITION.jpg
                    const edHeader = document.createElement('div');
                    edHeader.className = 'edition-header';
                    edHeader.innerHTML = `
                        <img src="data/editions/${editionName}.jpg" class="edition-master-jacket" onerror="this.src='data/editions/default.jpg'">
                        <div class="edition-info">
                            <span class="edition-label">COLLECTION_ARCHIVE</span>
                            <h3 class="edition-title">${editionName.replace(/_/g, ' ')}</h3>
                        </div>
                    `;
                    edWrapper.appendChild(edHeader);

                    // そのエディションに属する楽曲グリッド
                    const sGrid = document.createElement('div');
                    sGrid.className = 'song-grid';

                    editions[editionName].forEach(song => {
                        const sCard = document.createElement('div');
                        sCard.className = 'song-card';
                        sCard.innerHTML = `
                            <a href="songs.html?id=${song.id}" style="text-decoration:none;">
                                <img src="songs/${song.id}/${song.id}_artwork.jpg" class="song-jacket">
                                <span class="song-title">${song.title}</span>
                            </a>`;
                        sGrid.appendChild(sCard);
                    });

                    edWrapper.appendChild(sGrid);
                    container.appendChild(edWrapper);
                }
            } catch (e) { console.error(e); }
        }
        window.addEventListener('DOMContentLoaded', loadDiscography);
    </script>
</body>
</html>
