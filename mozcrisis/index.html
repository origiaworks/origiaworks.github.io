<script>
        async function loadDiscography() {
            try {
                const response = await fetch('data/songs.json'); // パス修正
                if (!response.ok) throw new Error("NETWORK_RESPONSE_NOT_OK");
                const data = await response.json();
                const container = document.getElementById('disc-grid-container');
                container.innerHTML = '';

                for (const sid in data) {
                    const song = data[sid];
                    const card = document.createElement('div');
                    card.className = 'disc-card';
                    card.innerHTML = `
                    <a href="songs.html?id=${sid}" style="text-decoration:none;">
                        <img src="songs/${sid}/${sid}_artwork.jpg" class="jacket" alt="${song.title}">
                        <span class="disc-title">${song.title}</span>
                    </a>
                    `;
                    container.appendChild(card);
                }
            } catch (e) {
                console.error("Discography Load Error:", e);
                document.getElementById('disc-grid-container').innerHTML = `<p style="color:var(--main-red);">[ERROR] SYSTEM_FAILURE</p>`;
            }
        }
        window.addEventListener('DOMContentLoaded', loadDiscography);
    </script>
