<script>
        async function loadProfile() {
            try {
                const params = new URLSearchParams(window.location.search);
                const MEMBER_ID = params.get('id') || 'rose';

                // パスはそのまま members/data/members.json
                const response = await fetch('members/data/members.json');
                const database = await response.json();
                const data = database[MEMBER_ID];

                if (!data) throw new Error("MEMBER_NOT_FOUND");

                document.documentElement.style.setProperty('--member-color', data.color);
                document.title = `PROFILE: ${MEMBER_ID.toUpperCase()} | MOZCRISIS`;
                document.getElementById('dynamic-name').textContent = data.name;
                document.getElementById('dynamic-real-name').textContent = data.realName;
                document.getElementById('dynamic-role').textContent = data.role;
                document.getElementById('dynamic-quote').textContent = data.quote;
                document.getElementById('dynamic-bio').textContent = data.bio;
                document.getElementById('dynamic-gear').textContent = data.gear;

                // 画像パス修正：members/img/ID_stand.png
                document.getElementById('dynamic-stand').src = `members/img/${MEMBER_ID}_stand.png`;

                const specGrid = document.getElementById('dynamic-specs');
                specGrid.innerHTML = '';
                data.specs.forEach(spec => {
                    const item = document.createElement('div');
                    item.className = 'spec-item';
                    item.innerHTML = `<div class="spec-label">${spec.label}</div><div class="spec-value">${spec.value}</div>`;
                    specGrid.appendChild(item);
                });
            } catch (e) { console.error(e); }
        }
        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
