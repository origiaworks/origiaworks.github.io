<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE | MOZCRISIS</title>
    <style>
        :root {
            --member-color: #ff3e3e; /* JSで上書き */
            --bg-black: #0a0a0a;
            --text-white: #e0e0e0;
            --code-font: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
            margin: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .watermark {
            position: fixed;
            top: 50%;
            right: -15%;
            transform: translateY(-50%);
            width: 100vh;
            aspect-ratio: 1 / 1;
            z-index: -1;
            opacity: 0.25;
            filter: brightness(1.1);
            pointer-events: none;
        }

        .watermark img { width: 100%; height: 100%; object-fit: contain; }

        nav {
            padding: 20px;
            font-family: var(--code-font);
            border-bottom: 1px solid #222;
            background: rgba(0,0,0,0.8);
        }

        nav a { color: var(--member-color); text-decoration: none; font-weight: bold; }

        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; }

        .header-area {
            margin-bottom: 60px;
            border-left: 5px solid var(--member-color);
            padding-left: 30px;
        }

        .role-title {
            font-family: var(--code-font);
            color: var(--member-color);
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .name-main { font-size: clamp(3rem, 8vw, 5rem); font-weight: 900; margin: 10px 0; }

        .quote-box {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-style: italic;
            margin: 40px 0;
            color: #fff;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--member-color);
            width: fit-content;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border: 1px solid #222;
        }

        .spec-label {
            font-family: var(--code-font);
            font-size: 0.7rem;
            color: var(--member-color);
            margin-bottom: 5px;
        }

        .bio-section h3 {
            font-family: var(--code-font);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: var(--member-color);
            margin-top: 40px;
        }

        .gear-box {
            background: #000;
            border: 1px dashed #444;
            padding: 20px;
            font-family: var(--code-font);
            font-size: 0.9rem;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .watermark { width: 70vh; right: -20%; opacity: 0.15; }
        }
    </style>
</head>
<body>

    <div class="watermark"><img id="dynamic-stand" src="" alt=""></div>

    <nav><a href="index.html"><< RETURN TO SYSTEM_ROOT</a></nav>

    <div class="container">
        <header class="header-area">
            <div id="dynamic-role" class="role-title"></div>
            <h1 id="dynamic-name" class="name-main"></h1>
            <div id="dynamic-real-name" class="name-sub"></div>
        </header>

        <div id="dynamic-quote" class="quote-box"></div>

        <div id="dynamic-specs" class="spec-grid">
            <!-- JSで挿入 -->
        </div>

        <section class="bio-section">
            <h3 id="bio-title">BIOGRAPHY</h3>
            <p id="dynamic-bio"></p>

            <h3 id="gear-title">EQUIPMENT</h3>
            <div id="dynamic-gear" class="gear-box"></div>
        </section>
    </div>

    <script>
        async function loadProfile() {
            try {
                const params = new URLSearchParams(window.location.search);
                const MEMBER_ID = params.get('id') || 'rose';

                const response = await fetch('members/data/members.json');
                const database = await response.json();
                const data = database[MEMBER_ID];

                if (!data) throw new Error("MEMBER_NOT_FOUND");

                // テーマカラーの適用
                document.documentElement.style.setProperty('--member-color', data.color);

                // テキスト反映
                document.title = `PROFILE: ${MEMBER_ID.toUpperCase()} | MOZCRISIS`;
                document.getElementById('dynamic-name').textContent = data.name;
                document.getElementById('dynamic-real-name').textContent = data.realName;
                document.getElementById('dynamic-role').textContent = data.role;
                document.getElementById('dynamic-quote').textContent = data.quote;
                document.getElementById('dynamic-bio').textContent = data.bio;
                document.getElementById('dynamic-gear').textContent = data.gear;

                // 画像反映 (img/jiwoo_stand.png など)
                document.getElementById('dynamic-stand').src = `members/img/${MEMBER_ID}_stand.png`;

                // スペック情報の生成
                const specGrid = document.getElementById('dynamic-specs');
                specGrid.innerHTML = '';
                data.specs.forEach(spec => {
                    const item = document.createElement('div');
                    item.className = 'spec-item';
                    item.innerHTML = `
                        <div class="spec-label">${spec.label}</div>
                        <div class="spec-value">${spec.value}</div>
                    `;
                    specGrid.appendChild(item);
                });

            } catch (e) {
                console.error(e);
                document.querySelector('.container').innerHTML = `<h1 style="color:red;">[ERROR] MEMBER_DATA_ACCESS_DENIED</h1>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
