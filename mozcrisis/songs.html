<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACK_DETAIL | MOZCRISIS</title>
    <style>
        :root { --main-red: #ff3e3e; --cyber-blue: #00f3ff; --bg-black: #0a0a0a; --card-bg: #151515; --text-white: #e0e0e0; --code-font: 'Consolas', 'Monaco', 'Courier New', monospace; }
        html, body { background-color: var(--bg-black) !important; color: var(--text-white) !important; font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; line-height: 1.6; }
        nav { padding: 15px 20px; font-family: var(--code-font); border-bottom: 1px solid #222; background: rgba(0, 0, 0, 0.9); position: fixed; width: 100%; top: 0; z-index: 1000; box-sizing: border-box; }
        nav a { color: var(--main-red); text-decoration: none; font-size: 0.8rem; }
        .hero-visual { width: 100%; height: 45vh; background-position: center; background-size: cover; position: relative; margin-top: 50px; background-color: #111; }
        .hero-visual::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--bg-black), transparent); }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        .song-header { display: flex; gap: 30px; margin-top: -80px; flex-wrap: wrap; }
        .artwork-area { flex: 0 0 220px; }
        .artwork-img { width: 100%; aspect-ratio: 1/1; border: 1px solid var(--main-red); object-fit: cover; background: #000; }
        .title-area { flex: 1; min-width: 300px; }
        .track-id { font-family: var(--code-font); color: var(--main-red); font-size: 1rem; }
        h1 { font-family: var(--code-font); font-size: clamp(1.8rem, 5vw, 2.8rem); margin: 5px 0; }
        .meta-list { display: flex; gap: 30px; border-top: 1px solid #333; padding-top: 15px; margin-top: 15px; }
        .meta-label { font-size: 0.7rem; color: #666; display: block; }
        .meta-value { font-family: var(--code-font); color: var(--cyber-blue); }
        .action-area { display: flex; flex-wrap: wrap; gap: 15px; margin: 30px 0 60px; }
        .btn { padding: 12px 25px; font-family: var(--code-font); font-size: 0.9rem; font-weight: bold; text-decoration: none; border: 1px solid; transition: 0.3s; text-align: center; flex: 1; min-width: 200px; }
        .btn-wav { color: var(--main-red); border-color: var(--main-red); }
        .btn-wav:hover { background: var(--main-red); color: #fff; box-shadow: 0 0 15px rgba(255, 62, 62, 0.4); }
        .btn-mp3 { color: var(--cyber-blue); border-color: var(--cyber-blue); }
        .btn-mp3:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .terminal { background: #000; border: 1px solid #333; margin-bottom: 100px; }
        .terminal-bar { background: #1a1a1a; padding: 10px; font-size: 0.7rem; color: #888; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
        .lyrics-box { padding: 40px; font-family: var(--code-font); font-size: 1rem; color: #aaa; white-space: pre-wrap; margin: 0; line-height: 1.8; }
        @media (max-width: 600px) { .song-header { margin-top: -40px; text-align: center; justify-content: center; } .meta-list { flex-direction: column; gap: 10px; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <nav><a href="index.html">RETURN_TO_DASHBOARD</a></nav>
    <div id="dynamic-hero" class="hero-visual"></div>
    <div class="container">
        <header class="song-header">
            <div class="artwork-area"><img id="dynamic-artwork" src="" class="artwork-img" alt="Artwork"></div>
            <div class="title-area">
                <div id="dynamic-track-id" class="track-id">LOADING...</div>
                <h1 id="dynamic-title">...</h1>
                <div class="meta-list">
                    <div class="meta-item"><span class="meta-label">RELEASE</span><span id="meta-release" class="meta-value">----</span></div>
                    <div class="meta-item"><span class="meta-label">ARCHITECT</span><span id="meta-architect" class="meta-value">----</span></div>
                    <!-- EDITION項目を追加 -->
                    <div class="meta-item"><span class="meta-label">EDITION</span><span id="meta-edition" class="meta-value">----</span></div>
                </div>
            </div>
        </header>
        <div class="action-area">
            <a id="link-wav" href="" download class="btn btn-wav">>> DOWNLOAD_WAV_MASTER</a>
            <a id="link-mp3" href="" download class="btn btn-mp3">>> DOWNLOAD_MP3_BINARY</a>
        </div>
        <div class="terminal">
            <div class="terminal-bar"><span id="file-name-display">source_code.txt</span><span>UTF-8 / RAW_FETCH</span></div>
            <pre id="lyrics-content" class="lyrics-box">Awaiting data stream...</pre>
        </div>
    </div>
    <script>
        async function loadModuleData() {
            try {
                const params = new URLSearchParams(window.location.search);
                const sid = params.get('id'); 
                if (!sid) return;
                const response = await fetch('data/songs.json');
                const database = await response.json();
                const data = database[sid];
                if (!data) return;

                document.getElementById('dynamic-title').textContent = data.title;
                document.getElementById('dynamic-track-id').textContent = "TRACK_" + sid.toUpperCase();
                document.getElementById('meta-release').textContent = data.release;
                document.getElementById('meta-architect').textContent = data.architect;
                document.getElementById('meta-edition').textContent = data.edition || "UNKNOWN_EDITION";

                document.getElementById('link-wav').href = `songs/${sid}/${sid}.wav`;
                document.getElementById('link-mp3').href = `songs/${sid}/${sid}.mp3`;
                document.getElementById('dynamic-hero').style.backgroundImage = `url('songs/${sid}/${sid}_keyvisual.png')`;
                document.getElementById('dynamic-artwork').src = `songs/${sid}/${sid}_artwork.jpg`;
                document.getElementById('file-name-display').textContent = sid + "_lyric.txt";
                fetchTextFile(`songs/${sid}/${sid}_lyric.txt`, 'lyrics-content');
            } catch (e) { console.error(e); }
        }
        async function fetchTextFile(path, targetId) {
            try {
                const response = await fetch(path);
                const text = await response.text();
                document.getElementById(targetId).innerText = text;
            } catch (e) { document.getElementById(targetId).innerText = "[ERROR] Resource not found."; }
        }
        window.addEventListener('DOMContentLoaded', loadModuleData);
    </script>
</body>
</html>
